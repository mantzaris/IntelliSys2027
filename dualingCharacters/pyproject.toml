[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-character-conflict"
version = "0.1.0"
description = "Auditable experiments in character conflict and conversational recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pcc = "pcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
